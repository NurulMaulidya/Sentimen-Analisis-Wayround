[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: pengujian berat yang butuh waktu lama (mis. ekuivalensi
        preprocessing atas 3078 baris dataset canonical). Lewati dengan
        `-m "not slow"` saat iterasi cepat.

filterwarnings =
    default
    # Peringatan DeprecationWarning berasal dari Sastrawi (pustaka pihak
    # ketiga), bukan dari kode project ini.
    ignore::DeprecationWarning:Sastrawi.*
    ignore::DeprecationWarning:.*Sastrawi.*
